<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-5">
          <div class="d-flex align-items-center mb-4">
            <!-- <img src="assets/profile-avatar.png" alt="Profile" class="rounded-circle border shadow" width="100" height="100"> -->
            <div class="ms-4">
              <h2 class="fw-bold mb-1">{{ profile?.Name || 'Your Name' }}</h2>
            </div>
          </div>
          <hr>
          <div class="row mb-4">
            <div class="col-md-6 mb-3 mb-md-0">
              <h5 class="fw-semibold text-secondary">Email</h5>
              <p class="mb-0">{{ profile?.email || 'your.email@example.com' }}</p>
            </div>
          </div>
          <h5 class="fw-semibold text-secondary mb-2">About Me</h5>
          <p class="mb-4">{{ profile?.about || 'A short professional summary about yourself goes here. Highlight your skills, experience, and what makes you unique.' }}</p>
          <div class="d-flex gap-3">
            <button (click)="openAboutMeModal()" class="btn btn-primary">Update About</button>

            @if (showAboutMeModal) {
              <div
                class="modal fade show"
                tabindex="-1"
                style="display: block; background: rgba(0,0,0,0.5);"
              >
                <div class="modal-dialog">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h5 class="modal-title">Update About me</h5>
                      <button type="button" class="btn-close" (click)="closeAboutMeModal()" aria-label="Close"></button>
                    </div>
                    <form (ngSubmit)="saveAboutMe()" #projectFormDirective="ngForm">
                      <div class="modal-body">
                        <div class="mb-3">
                          <label class="form-label" for="about">AboutMe</label>
                          <textarea id="about" class="form-control" [(ngModel)]="aboutMeEdit" [ngModelOptions]="{standalone: true}" required rows="7" cols="40"></textarea>
                        </div>
                      </div>
                      <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="closeAboutMeModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Update</button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
