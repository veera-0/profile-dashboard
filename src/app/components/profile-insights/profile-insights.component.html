      <div class="last-seven-days mt-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
          <h5 class="mb-0 text-dark">Last 7 Days</h5>
          <select
            class="form-select form-select-sm w-auto"
            [value]="selectedButton"
            (change)="onButtonSelectionChange($event)"
          >
            @for (btn of uniqueButtonEvents; track btn) {
              <option [value]="btn">{{ getButtonLabel(btn) }}</option>
            }
          </select>
        </div>

        @if (lastSevenDaysLoading) {
          <div class="d-flex justify-content-center py-3">
            <div class="spinner-border spinner-border-sm text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        } @else {
          <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle mb-0 analytics-table">
              <thead class="table-light">
                <tr>
                  <th scope="col">Date</th>
                  <th scope="col" class="text-end">Clicks</th>
                </tr>
              </thead>
              <tbody>
                @if (lastSevenDays.length === 0) {
                  <tr>
                    <td colspan="2" class="text-center text-muted py-3">No data for the last 7 days.</td>
                  </tr>
                } @else {
                  @for (row of lastSevenDays; track row.click_date) {
                    <tr>
                      <td>{{ row.click_date }}</td>
                      <td class="text-end fw-semibold">{{ row.click_count }}</td>
                    </tr>
                  }
                }
              </tbody>
            </table>
          </div>
        }
      </div>
